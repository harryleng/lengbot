# =============================================================================
# 安全说明（2026-09-07 修订）
#
# 本文件此前内联了 PostgreSQL / Redis / MinIO / Neo4j 的真实凭据，以及一个真实的
# Tavily API Key。现已统一改为环境变量注入，格式为 ${ENV:默认值}：
#   · 设置了同名环境变量 → 使用环境变量（生产环境必须如此）
#   · 未设置             → 回退到默认值（保证本地开发开箱可用，行为与修订前一致）
#
# ⚠️ 改本文件不能让已泄露的凭据失效——它们已经进入 git 历史。
#    请务必轮换：PostgreSQL / Redis / MinIO / Neo4j / Tavily API Key。
#    轮换后通过环境变量注入，不要再写回本文件。
#
# 需要设置的环境变量：
#   LENGBOT_DB_USERNAME · LENGBOT_DB_PASSWORD · LENGBOT_DB_NAME
#   LENGBOT_REDIS_HOST · LENGBOT_REDIS_PORT · LENGBOT_REDIS_PASSWORD
#   MINIO_ENDPOINT · MINIO_ACCESS_KEY · MINIO_SECRET_KEY
#   NEO4J_URI · NEO4J_USERNAME · NEO4J_PASSWORD
#   TAVILY_API_KEY（已移除默认值；未配置时 web_search 返回明确提示，不会报错）
#   OPENAI_API_KEY · DASHSCOPE_API_KEY · GITHUB_TOKEN · SILICONFLOW_API_KEY
# =============================================================================
server:
  port: 8082
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200
    max-connections: 10000

spring:
  main:
    allow-circular-references: true
  application:
    name: lengbot-server
  # ========================================
  # 关闭 Nacos（本地无 Nacos 服务时必需）
  # 注意：本工程未引入 spring-cloud-starter-bootstrap，
  # 因此 bootstrap.yml 在 Spring Boot 3 下不会被加载。
  # Nacos 开关必须写在这里（application.yml）才会生效。
  # ========================================
  # Nacos config 已关闭（enabled=false），不再声明 spring.config.import，避免配置中心覆盖本地配置。
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ========================================
  # PostgreSQL 数据库配置
  # 驱动：org.postgresql.Driver
  # 需要安装 pgvector 扩展用于向量存储
  # ========================================
  datasource:
    url: jdbc:postgresql://localhost:5432/${LENGBOT_DB_NAME:lengbot}
    username: '${LENGBOT_DB_USERNAME:postgres}'
    password: '${LENGBOT_DB_PASSWORD:difyai123456}'
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ========================================
  # 只读数据源（供 PgSqlTool 等执行用户 SQL 的工具使用）
  # 限定权限：仅 SELECT，无 DML/DDL
  # ========================================
  datasource-readonly:
    url: jdbc:postgresql://localhost:5432/${LENGBOT_DB_NAME:lengbot}
    username: '${LENGBOT_DB_USERNAME:postgres}'
    password: '${LENGBOT_DB_PASSWORD:difyai123456}'
    driver-class-name: org.postgresql.Driver

  # ========================================
  # Redis 配置（缓存、会话、任务队列）
  # ========================================
  data:
    redis:
      # 复用现有 redis 容器（redis:latest，Redis 7.4）：容器内部端口 6379 映射到宿主机 9736
      # 密码为容器 redis.conf 中的 requirepass，与默认的 123456 不同
      host: '${LENGBOT_REDIS_HOST:localhost}'
      port: '${LENGBOT_REDIS_PORT:9736}'
      password: '${LENGBOT_REDIS_PASSWORD:wc@961029}'
      database: '9'


# ========================================
# MyBatis-Plus 配置
# ========================================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-enums-package: com.lengbot.enums
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ========================================
# Sa-Token 认证配置
# ========================================
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: 86400
  active-timeout-check: true
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-param: true
  redis:
    key-prefix: 'sa-token:'
    database: 0

# ========================================
# MinIO 对象存储配置
# ========================================
minio:
  # 容器 lengbot-minio：API 端口 9100（宿主机 9000 被 portainer 占用），控制台 9101
  endpoint: '${MINIO_ENDPOINT:http://localhost:9100}'
  access-key: '${MINIO_ACCESS_KEY:minioadmin}'
  secret-key: '${MINIO_SECRET_KEY:minioadmin}'
  bucket: 'lengbot'

# ========================================
# Neo4j 图数据库配置（知识图谱）
# ========================================
neo4j:
  uri: '${NEO4J_URI:bolt://localhost:7687}'
  username: '${NEO4J_USERNAME:neo4j}'
  password: '${NEO4J_PASSWORD:neo4j123}'

# ========================================
# LengBot 系统配置
# ========================================
lengbot:
  sandbox:
    # 不配置则默认minio
    backend: local
    local-root: ./data/sandbox
  # 本地文件访问工具（Agent 直接读写本机磁盘，白名单根目录；留空则禁用该工具）
  local-file:
    root: 'D:/lengbot/workspace'
  # 对话内核：harness（AgentScope HarnessAgent，默认）/ legacy（手搓工具循环，回滚用）
  chat:
    engine: 'harness'

  # ========================================
  # TTS 语音合成配置（后端可插拔 Provider 架构）
  # provider: mock（开发/兜底，生成测试音频）| edge-tts（纯 Java 复刻微软在线 TTS）
  # 数字人播报与消息朗读均走后端 /api/tts/synthesize
  # ========================================
  tts:
    provider: edge-tts
    default-voice: zh-CN-XiaoxiaoNeural
    default-rate: "+0%"
    default-pitch: "+0Hz"
    format: audio-24khz-48kbitrate-mono-mp3
    max-text-length: 2000
    edge-tts:
      # 区域影响 WebSocket 接入点；token/voices 地址一般无需改动
      region: eastus
      token-url: https://edge.microsoft.com/tts/cognitiveservices/voices/list
      voices-url: https://dev.microsofttranslator.com/voices/list?api-version=1.0
      connect-timeout-ms: 10000
      read-timeout-ms: 30000
      token-ttl-seconds: 300
  # AgentScope AI 引擎配置（替代原 Spring AI 配置）
  agentscope:
    # 默认模型（AgentScope ModelRegistry 中的模型名称）
    default-model: 'dashscope:qwen-plus'
    # OpenAI 兼容 API 配置
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    # 阿里云 DashScope 配置
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
    # Ollama 本地模型配置
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

  # Dify 集成加密配置
  dify:
    encryption-key: ${LENGBOT_DIFY_ENCRYPTION_KEY:}
    encryption-key-version: v1
    connect-timeout-seconds: 3
    read-timeout-seconds: 15

  # OCR 配置（RapidOCR）
  ocr:
    enabled: false
    model-path: ${OCR_MODEL_PATH:models/RapidOCR/PP-OCRv4}
    auto-download: true

  # 任务队列配置
  task:
    consumer:
      pool-size: 2
      heavy-pool-size: 1
    reclaim:
      interval-seconds: 30
      stale-threshold-minutes: 5
      batch-size: 100
    delay:
      interval-seconds: 1
      batch-size: 100
    retry:
      default-policy:
        max-attempts: 3
        backoff-base-ms: 5000
        backoff-multiplier: 2.0
        backoff-max-ms: 600000
      overrides:
        GRAPH_EXTRACTION:
          max-attempts: 2
          backoff-base-ms: 30000
          backoff-multiplier: 2.0
          backoff-max-ms: 600000
        QA_PAIR_GENERATE:
          max-attempts: 2
          backoff-base-ms: 10000
        RAG_EVALUATION:
          max-attempts: 1
    zombie:
      interval-seconds: 60
      default-timeout-minutes: 10
      batch-size: 100
      overrides:
        GRAPH_EXTRACTION: 60
        QA_PAIR_GENERATE: 30
        RAG_EVALUATION: 20

  # SubAgent 孤儿任务回收（崩溃兜底）
  # 子 Agent 同步跑在对话链路里，不入 task 表也没有 PEL，TaskZombieScheduler 覆盖不到；
  # 进程被强杀时 subagent_run 会永久卡在 pending/running，批次计数永不收敛。
  # timeout-minutes 必须大于子 Agent 单次执行的最长合理耗时，否则会误判正在跑的任务
  # （推进用 CAS，误判区间内已完成的会被挡住，但仍在跑的会被误杀，故宁可放宽）。
  subagent:
    reap:
      enabled: true
      interval-seconds: 120
      timeout-minutes: 30
      batch-size: 200

  # Milvus 向量数据库配置
  milvus:
    enabled: 'true'
    uri: 'http://localhost:19530'
    token: ''
    connect-timeout-ms: 10000
    wait-timeout-ms: 30000

  # 日志 TTL 清理配置
  log-cleanup:
    retention-days: 30

  # CORS 配置
  # 前端 dev 端口映射：
  #   8082=lengbot 后端 → 前端 vite 默认跑在 5174（lengbot-ui）
  #   8081=旧 LengBot 后端 → 前端 5173
  # 注意：allowed-origins 必须写成【逗号分隔的 CSV 字符串】。
  # 消费方 CorsConfig 是用 @Value("${lengbot.cors.allowed-origins:...}") 注入 String 后
  # 自行 split(",")，不是 @ConfigurationProperties 绑 List<String>。
  # 若写成 YAML 列表（缩进 "-"），Spring 会拍平成 allowed-origins[0]/[1]/[2]，
  # ${lengbot.cors.allowed-origins} 这个 key 解析不到 → 静默回退到 @Value 的默认值，
  # 这里改什么都不生效（历史踩坑：日志打印的白名单永远等于默认值）。
  #
  # 局域网 IP 访问 dev server（如 http://10.10.13.163:5174）时也需加进白名单，
  # 否则 CorsFilter 返回 403 "Invalid CORS request"，前端登录提示"无权访问"。
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://10.10.13.163:5173,http://10.10.13.163:5174,http://localhost:5174,http://localhost
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allow-credentials: true
    max-age: 3600

  # GitHub API Token（可选）
  github:
    token: ${GITHUB_TOKEN:}

  # Tavily 联网搜索 API Key
  # 历史问题：此处曾内联一个真实 key 作为默认值，导致密钥随代码进入版本库。
  # 现改为纯环境变量注入，未配置时为空。请到 https://app.tavily.com 轮换旧 key。
  tavily:
    api-key: ${TAVILY_API_KEY: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}

  # SiliconFlow AI 生图 API Key
  siliconflow:
    api-key: ${SILICONFLOW_API_KEY:}

# ========================================
# SpringDoc / Swagger 配置
# ========================================
springdoc:
  enabled: 'true'
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
